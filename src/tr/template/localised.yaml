- learn_more: 'İlgili arayüz kılavuzunu aç'
- pin_desc_gpio: 'Bu başlık konumu genel amaçlı dijital giriş/çıkış olarak kullanılabilir. libgpiod kullanın ve hattı sistemdeki adıyla çözümleyin; denetleyici ve hat numaraları çekirdek ya da device tree ile değişebilir.'
- pin_warning_gpio: 'Herkese açık dokümantasyon pin başına veya toplam GPIO kaynak/çekme akımını, pull yapılandırmasını ve açılış sırasındaki garanti edilen seviyeyi belirtmiyor. Doğrudan 5 V lojik uygulamayın; LED, röle, buzzer, motor veya başka bir yükü uygun direnç, tampon ya da sürücü olmadan doğrudan sürmeyin.'
- pin_desc_i2c: 'Fiziksel 3 ve 5 numaralı pinler I2C-MCU0 SDA ve SCL sinyallerini taşır. Aygıt numarası imaj ve overlay yapılandırmasına göre değişebilir; kullanmadan önce /dev/i2c-* listesinden etkin veri yolunu doğrulayın.'
- pin_warning_i2c: 'Yalnızca 3,3 V uyumlu cihaz kullanın. Herkese açık dokümantasyon başlıktaki pull-up değerlerini vermediğinden haricî direnç eklemeden önce mevcut pull-up yapılandırmasını ve toplam veri yolu yükünü doğrulayın. Bağlanan cihazların adresleri çakışmamalıdır.'
- pin_desc_hat_i2c: 'Bu pin, açılış sırasında HAT EEPROM kimliğini okumak için ayrılan I2C-WKUP0 arayüzüne aittir. Haricî aksesuarlar için kullanılan I2C-MCU0 veri yolu değildir.'
- pin_warning_hat_i2c: 'Doğrulanmış bir HAT EEPROM yoksa fiziksel 27 ve 28 numaralı pinleri boş bırakın. Donanım ve önyükleme yapılandırmasını doğrulamadan genel amaçlı I2C veya GPIO olarak kullanmayın.'
- pin_desc_spi: 'Bu pin SPI-MCU0 arayüzüne aittir. Uygun device tree yapılandırması etkinken CS0 /dev/spidev0.0, CS2 ise /dev/spidev0.2 olarak sunulur.'
- pin_warning_spi: 'Belgelenen yapılandırmalarda SPI-MCU0 kart üzerindeki sensörlerle paylaşılır. 3,3 V lojik kullanın, seçili olmayan her haricî cihazın MISO hattını serbest bıraktığından emin olun ve bağlantıdan önce 1-CS veya 2-CS overlay yapılandırmasını doğrulayın.'
- pin_desc_uart: 'Fiziksel 8 ve 10 numaralı pinler /dev/ttyS3 olarak sunulan UART-MAIN1 TX ve RX sinyallerini taşır. Ayrı üç pinli debug bağlantısı UART-MAIN0 arayüzüdür.'
- pin_warning_uart: 'Yalnızca 3,3 V TTL lojik kullanın; RS-232 seviyelerini veya 5 V UART hattını doğrudan bağlamayın. GPIO14 üzerinde PWM-0B etkinleştirildiğinde UART-MAIN1 TX kapanır, RX çalışmaya devam edebilir.'
- pin_desc_pcm: 'Bu pin varsayılan 40 pin eşlemesinde PCM/I2S türü ses arayüzüne ayrılmıştır. Ses HAT desteği Gemstone device tree ve Linux sürücülerine bağlıdır; yalnızca fiziksel pinlerin eşleşmesi yeterli değildir.'
- pin_warning_pcm: 'Sinyal yönleri, saatler ve ses sürücüsü desteği seçilen overlay ve çevre birimi için doğrulanmalıdır. Yalnızca fiziksel pinlerin eşleşmesine bakarak bir Raspberry Pi ses HAT’inin çalışacağını varsaymayın.'
- pin_desc_3v3: 'Bu pin düşük güçlü aksesuarlar için regüle 3,3 V başlık beslemesini sunar.'
- pin_warning_3v3: 'Herkese açık dokümantasyon güvenli toplam aksesuar akımını veya bu hattın geriden beslenmesine izin verilip verilmediğini belirtmiyor. Güç ağacı sınırları doğrulanmadan haricî gerilim uygulamayın veya yüksek akımlı yük beslemeyin.'
- pin_desc_5v: 'Bu pin kartın 5 V hattını sunar. Kullanılabilir aksesuar akımı giriş beslemesine, kart yüküne ve güç ağacı sınırlarına bağlıdır.'
- pin_warning_5v: 'Başlık üzerinden geriden besleme davranışı ve koruması herkese açık biçimde belirtilmemiştir. T3 dokümantasyonu açıkça onaylamadıkça karta 2 veya 4 numaralı pinlerden güç vermeyin. Motor, ısıtıcı, büyük LED veya servo yükleri için gerektiğinde ortak topraklı ve uygun kapasiteli haricî besleme kullanın.'
- pin_desc_ground: 'Bu pin kartın toprak düzlemine bağlıdır ve güç ile lojik sinyaller için 0 V referansı sağlar. Kablolamayı kısa ve anlaşılır tutmak için sinyal grubuna en yakın toprak pinini tercih edin.'
