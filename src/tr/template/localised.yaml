- pin_desc_gpio: 'Bu başlık konumu genel amaçlı dijital giriş veya çıkış olarak kullanılabilir. libgpiod kullanın ve hattı sistemdeki adıyla çözümleyin; denetleyici ve hat numaraları çekirdek ya da device tree ile değişebilir. Bu pine doğrudan 5 V lojik uygulamayın.'
- pin_desc_i2c: 'Bu pin harici I2C1 veri yolunun bir parçasıdır. SDA ve SCL adreslenmiş aygıtlar tarafından paylaşılır; bu nedenle veri yolundaki her aygıt çakışmayan bir adres kullanmalıdır. Güncel Gemstone imajı I2C1 denetleyicisini /dev/i2c-2 olarak sunar.'
- pin_desc_spi: 'Bu pin SPI0 eşzamanlı seri veri yoluna aittir. MOSI, MISO ve SCLK paylaşılabilir; her çevre birimi normalde kendine ait aktif-düşük chip-select sinyali kullanır. Donanımı bağlamadan önce Linux spidev düğümünü ve device-tree yapılandırmasını doğrulayın.'
- pin_desc_uart: 'Bu pin 40 pin başlıktaki UART0 seri bağlantısının bir tarafını taşır. 3,3 V lojik kullanır; RS-232 gerilimlerine veya 5 V UART hattına doğrudan bağlanmamalıdır. Ayrı üç pinli debug bağlantısı farklı bir arayüzdür.'
- pin_desc_pcm: 'Bu pin varsayılan 40 pin eşlemesinde PCM/I2S türü ses arayüzüne ayrılmıştır. Ses HAT desteği Gemstone device tree ve Linux sürücülerine bağlıdır; yalnızca fiziksel pinlerin eşleşmesi yeterli değildir.'
- pin_desc_3v3: 'Bu pin düşük güçlü aksesuarlar için regüle 3,3 V sağlar. Herkese açık dokümantasyon toplam aksesuar akımı sınırını belirtmediğinden, yüksek bir yükü beslemeden önce kartın güç ağacı sınırını doğrulayın.'
- pin_desc_5v: 'Bu pin kartın 5 V hattını sunar. Kullanılabilir aksesuar akımı giriş beslemesine ve kart yüküne bağlıdır. Motor, ısıtıcı ve büyük LED dizileri gerektiğinde uygun kapasitede harici besleme kullanmalıdır.'
- pin_desc_ground: 'Bu pin kartın toprak düzlemine bağlıdır ve güç ile lojik sinyaller için 0 V referansı sağlar. Kablolamayı kısa ve anlaşılır tutmak için sinyal grubuna en yakın toprak pinini tercih edin.'
