- pin_desc_gpio: 'This header position is available as a general-purpose digital input or output. Use libgpiod and resolve the line by its system name; controller and line numbers may change with the kernel or device tree. Never apply 5 V logic directly to this pin.'
- pin_desc_i2c: 'This pin is part of the external I2C1 bus. SDA and SCL are shared by addressed devices, so every device on the bus must use a non-conflicting address. The current Gemstone image exposes I2C1 as /dev/i2c-2.'
- pin_desc_spi: 'This pin belongs to the SPI0 synchronous serial bus. MOSI, MISO and SCLK can be shared, while each peripheral normally requires its own active-low chip-select. Confirm the Linux spidev node and device-tree configuration before connecting hardware.'
- pin_desc_uart: 'This pin carries one side of the UART0 serial connection on the 40-pin header. It uses 3.3 V logic and must not be connected directly to RS-232 voltage levels or a 5 V UART. The separate three-pin debug connector is a different interface.'
- pin_desc_pcm: 'This pin is assigned to the PCM/I2S-style audio interface in the default 40-pin mapping. Audio HAT support depends on the Gemstone device tree and Linux drivers; matching the physical pins alone is not sufficient.'
- pin_desc_3v3: 'This pin supplies regulated 3.3 V to low-power accessories. The public documentation does not state a combined accessory-current budget, so verify the board power-tree limit before powering a substantial load.'
- pin_desc_5v: 'This pin exposes the board 5 V rail. Available accessory current depends on the input supply and the board load. Motors, heaters and large LED arrays should use a correctly rated external supply when appropriate.'
- pin_desc_ground: 'This pin is connected to the board ground plane and provides the 0 V reference for power and logic signals. Prefer the ground pin nearest the signal group to keep wiring short and clear.'
