- pin_desc_gpio: 'This header position can be used as general-purpose digital I/O. Use libgpiod and resolve the line by its system name; controller and line numbers can change with the kernel or device tree.'
- pin_warning_gpio: 'The public documentation does not specify per-pin or combined GPIO source/sink current, pull configuration, or guaranteed level during boot. Never apply 5 V logic and do not drive LEDs, relays, buzzers, motors or other loads directly; use an appropriate resistor, buffer or driver.'
- pin_desc_i2c: 'Physical pins 3 and 5 carry I2C-MCU0 SDA and SCL. Device numbering can change with the image and overlays; list /dev/i2c-* and verify the active bus before use.'
- pin_warning_i2c: 'Use only 3.3 V-compatible devices. The public documentation does not give the header pull-up values, so verify the installed pull-ups and total bus loading before adding external resistors. Devices on the bus must use non-conflicting addresses.'
- pin_desc_hat_i2c: 'This pin belongs to I2C-WKUP0, which is reserved for identifying a HAT EEPROM during boot. It is not the external I2C-MCU0 accessory bus.'
- pin_warning_hat_i2c: 'Leave physical pins 27 and 28 unconnected when no verified HAT EEPROM is present. Do not use them as general-purpose I2C or GPIO without validating the hardware and boot configuration.'
- pin_desc_spi: 'This pin belongs to SPI-MCU0. CS0 is exposed as /dev/spidev0.0 and CS2 as /dev/spidev0.2 when the matching device-tree configuration is active.'
- pin_warning_spi: 'SPI-MCU0 is shared with onboard sensors in documented configurations. Use 3.3 V logic, ensure every external device releases MISO when not selected, and verify whether the 1-CS or 2-CS overlay is active before wiring.'
- pin_desc_uart: 'Physical pins 8 and 10 carry UART-MAIN1 TX and RX, exposed as /dev/ttyS3. The separate three-pin debug connector is UART-MAIN0 and is a different interface.'
- pin_warning_uart: 'Use 3.3 V TTL logic only; never connect RS-232 levels or a 5 V UART directly. Enabling PWM-0B on GPIO14 disables UART-MAIN1 TX, while RX can remain active.'
- pin_desc_pcm: 'This pin is assigned to the PCM/I2S-style audio interface in the default 40-pin mapping. Audio HAT support depends on the Gemstone device tree and Linux drivers; matching the physical pins alone is not sufficient.'
- pin_warning_pcm: 'Signal directions, clocks and audio-driver support must be checked for the selected overlay and peripheral. Do not assume that a Raspberry Pi audio HAT works from physical pin matching alone.'
- pin_desc_3v3: 'This pin exposes the regulated 3.3 V header supply for low-power accessories.'
- pin_warning_3v3: 'The public documentation does not state a safe combined accessory-current budget or permission to back-power this rail. Do not inject an external voltage or power a substantial load until the board power-tree limits are confirmed.'
- pin_desc_5v: 'This pin exposes the board 5 V rail. Available accessory current depends on the input supply, board load and power-tree limits.'
- pin_warning_5v: 'Header back-power behaviour and protection are not publicly specified. Do not feed power into pins 2 or 4 unless T3 documentation explicitly approves the method. Use a correctly rated external supply for motors, heaters and large LED or servo loads, with a shared ground where required.'
- pin_desc_ground: 'This pin is connected to the board ground plane and provides the 0 V reference for power and logic signals. Prefer the ground pin nearest the signal group to keep wiring short and clear.'
